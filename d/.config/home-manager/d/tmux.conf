set-option -g prefix C-z
unbind-key C-b
bind-key C-z last-window
bind-key C-n next-window
bind-key C-p previous-window
bind-key C-c new-window
bind-key S command-prompt -p name:,host: "new-window -n %1 'ssh %2'"
bind-key E new-window -n 'EMACS' 'emacs -nw'
bind-key O new-window -n 'OPENCODE' -c '#{pane_current_path}' 'exec opencode'
bind-key o display-popup -c '#{pane_current_path}' -w 85% -h 85% -E 'opencode mini'
bind-key z send-keys C-z
set -g status-bg black
set -g status-fg green
set -g status-left-length 15
set -g status-left ' #[fg=cyan,bright]#H#[fg=green]:#[fg=white]#S#[fg=green] | #[default]'
set -g status-right '| #[fg=green]#($HOME/bin/oc-status) #[fg=yellow]%Y-%m-%d %H:%M '
set -g status-right-length 60
set -g status-justify centre
setw -g mode-keys emacs
setw -g status-keys emacs
setw -g window-status-current-style fg=cyan,bold
setw -g aggressive-resize on
# Truecolor passthrough so the opencode TUI gets its real palette instead of an
# approximation. Covers this Linux client and ghostty on macOS.
set -ga terminal-features ',xterm-256color:RGB,xterm-ghostty:RGB'
# Let pane apps see focus state, which opencode uses to decide when to alert.
set -g focus-events on
