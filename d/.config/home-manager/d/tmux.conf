set-option -g prefix C-z
unbind-key C-b
bind-key C-z last-window
bind-key C-n next-window
bind-key C-p previous-window
bind-key C-c new-window
bind-key S command-prompt -p name:,host: "new-window -n %1 'ssh %2'"
bind-key E new-window -n 'EMACS' 'emacs -nw'
bind-key O new-window -n 'OPENCODE' -c '#{pane_current_path}' 'exec opencode'
bind-key o select-pane -t :.+
bind-key P display-popup -d '#{pane_current_path}' -w 85% -h 85% -E 'opencode mini'
bind-key z send-keys C-z
bind-key r source-file ~/.tmux.conf \; display-message 'tmux.conf reloaded'
set -g status-bg black
set -g status-fg green
set -g status-left-length 40
set -g status-left ' #[fg=cyan,bright]#H#[fg=green]:#[fg=white]#S #[fg=cyan]#($HOME/bin/diskfree .)#[fg=green] | #[default]'
# Indices of windows with a pending bell, visible even when they scroll off
# the window list. prefix-a jumps to the next one.
set -g status-right '| #[fg=black,bg=yellow]#{W:#{?window_bell_flag, #I ,}}#[default] #[fg=green]#($HOME/bin/oc-status) #[fg=yellow]%Y-%m-%d %H:%M '
set -g status-right-length 80
bind-key a next-window -a
set -g status-justify centre
setw -g mode-keys emacs
setw -g status-keys emacs
setw -g window-status-current-style fg=cyan,bold
# Name windows after the pane title when a program set a meaningful one (agent
# harnesses put their session topic and status there), else the cwd basename.
# Shells, empty titles and the default hostname title fall back to the cwd.
setw -g automatic-rename-format '#{?#{||:#{m:*sh,#{pane_current_command}},#{||:#{==:#{pane_title},},#{m:#H*,#{pane_title}}}},#{b:pane_current_path},#{=/20/…:pane_title}}'
setw -g aggressive-resize on
# Truecolor passthrough so the opencode TUI gets its real palette instead of an
# approximation. Covers this Linux client and ghostty on macOS.
set -ga terminal-features ',xterm-256color:RGB,xterm-ghostty:RGB'
# Let pane apps see focus state, which opencode uses to decide when to alert.
set -g focus-events on
# Never ask the outer terminal to report the mouse. Pane apps (opencode,
# claude) request it, and a dropped ssh then leaves the client terminal
# stuck in mouse mode, spewing ^[[<35;80;20M. As a bonus, drag-select and
# copy stay native. Cost: no mouse clicks or wheel inside those apps.
set -ag terminal-overrides ',*:XM@'
# Popups default to a dark grey background in tmux 3.8, which opencode's
# system theme picks up and renders unreadably. Use the terminal's colors.
set -g popup-style default
